name: check-slots

on:
  schedule:
    - cron: "*/5 * * * *"          # backup restart only; GitHub may delay or skip these
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message only (1 = yes)"
        default: "0"
      rehearsal:
        description: "Rehearsal: fill everything, stop before final CAPTCHA, no booking (1 = yes)"
        default: "0"
      city:
        description: "City to check (use Abu Dhabi for rehearsal)"
        default: "New Delhi"

concurrency:
  group: check-slots
  cancel-in-progress: false          # one run at a time; the next one waits in the queue

permissions:
  contents: read
  actions: write                    # lets a run start its successor

jobs:
  check:
    if: github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355            # GitHub hard limit is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install System Dependencies (Tesseract OCR)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - run: pip install playwright requests opencv-python-headless pytesseract pillow
      - run: playwright install --with-deps chromium

      - name: Monitor loop
        run: python -u check.py        # -u = unbuffered, so log lines appear live
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test }}
          DRY_RUN: ${{ github.event.inputs.rehearsal }}
          CITY: ${{ github.event.inputs.city || 'New Delhi' }}
          SERVICE_MATCH: "Long-stay"
          AUTOFILL: ${{ github.event.inputs.rehearsal == '1' && '1' || secrets.AUTOFILL }}
          LOOP_SECONDS: ${{ github.event.inputs.rehearsal == '1' && '0' || '19800' }}
          INTERVAL_SECONDS: "60"
          REALERT_SECONDS: "900"
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          SURNAME: ${{ secrets.SURNAME }}
          DOB: ${{ secrets.DOB }}
          PHONE: ${{ secrets.PHONE }}
          EMAIL: ${{ secrets.EMAIL }}
          VISA_APP_NO: ${{ secrets.VISA_APP_NO }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Start next run (self-chain)
        if: (success() || failure()) && vars.MONITOR_ENABLED == 'true' && github.event.inputs.test != '1' && github.event.inputs.rehearsal != '1' && hashFiles('debug/booked.flag') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run check.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
