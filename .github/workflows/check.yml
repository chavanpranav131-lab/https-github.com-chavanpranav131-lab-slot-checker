name: check-slots

on:
  schedule:
    - cron: "*/5 * * * *"          # backup restart only; GitHub may delay or skip these
  workflow_dispatch:
    inputs:
      test:
        description: "Send test message (1 = yes)"
        default: "0"

concurrency:
  group: check-slots
  cancel-in-progress: false         # one run at a time; the next one waits in the queue

permissions:
  contents: read
  actions: write                    # lets a run start its successor

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 355            # GitHub hard limit is 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install playwright requests
      - run: playwright install --with-deps chromium

      - name: Monitor loop
        run: python check.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TEST_MODE: ${{ github.event.inputs.test }}
          CITY: "Abu Dhabi"
          SERVICE_MATCH: "Long-stay"
          AUTOFILL: "1"
          CAPTCHA_WAIT_SECONDS: "200"
          LOOP_SECONDS: "19800"        # 5.5 h of checking per run
          INTERVAL_SECONDS: "60"       # one check per minute
          REALERT_SECONDS: "900"
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          SURNAME: ${{ secrets.SURNAME }}
          DOB: ${{ secrets.DOB }}
          PHONE: ${{ secrets.PHONE }}
          EMAIL: ${{ secrets.EMAIL }}
          VISA_APP_NO: ${{ secrets.VISA_APP_NO }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
          retention-days: 3

      - name: Start next run (self-chain)
        if: always() && github.event.inputs.test != '1' && hashFiles('debug/booked.flag') == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 20
          gh workflow run check.yml --repo "${{ github.repository }}" --ref "${{ github.ref_name }}"
